name: Tests

# Runs both Node test suites on every push and pull request. Keeping
# the npm install here (fake-indexeddb for the tts-pack functional
# test) means no local npm access is ever needed - the same reason the
# suites live in CI in the first place.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependency
        run: npm install fake-indexeddb@6 --no-save --no-fund --no-audit

      - name: Audio pack part-splitting suite
        run: node test/test-audio-pack-parts.js

      - name: Daily Reading suite
        run: node test/test-reading-feeds.js
