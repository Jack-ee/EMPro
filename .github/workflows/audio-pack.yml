name: Build audio pack

# Builds the EMPro pronunciation pack and publishes it as a Release asset.
#
# Runs when:
#   - tools/wordlist.txt changes on the main branch (the EMPro app commits
#     that file itself, so a build starts without anyone touching git), or
#   - it is started by hand from the Actions tab (Run workflow).
#
# A run is bounded so that a timeout can never lose synthesised audio; see
# the three nested limits on the build step below.
#
# Setup needed once:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     name : OPENAI_API_KEY
#     value: your OpenAI API key (sk-...)
#   The key stays encrypted in the secret and never reaches the app.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max words to synthesise this run (blank = all). Use a small number for a test run."
        required: false
        default: ""
      budget:
        description: "Minutes this run may spend synthesising before it stops and publishes what it has."
        required: false
        default: "320"
      prune_voices:
        description: "Also delete clips whose voice is no longer used, reclaiming pack space. Re-selecting that voice means paying again."
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - tools/wordlist.txt

# The job updates a Release, so it needs write access to repository contents.
permissions:
  contents: write

# One build at a time; a newer run waits rather than racing the release.
concurrency:
  group: audio-pack
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Outermost of three nested limits. A hosted runner is killed at 360
    # minutes, so 350 keeps 10 minutes in hand for the publish step to run
    # after a hung build is cut off. See the build step for the other two.
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Free, offline, and seconds long, so it runs before anything can cost
      # money. The self-test covers the pack format and the split-pack
      # determinism the client's "same hash, skip it" logic depends on; the
      # parts test drives a whole incremental build against fake GitHub and
      # OpenAI. A regression in either would otherwise show up as a wrong or
      # needlessly re-synthesised pack, after the API bill.
      - name: Test the generator
        timeout-minutes: 5
        run: |
          python tools/generate_audio_pack.py --selftest
          python test/test_audio_parts_v103.py

      # Three nested limits, innermost first:
      #
      #   TIME_BUDGET_MINUTES  320  the generator's own budget. It stops
      #                             itself, writes the partial pack, and
      #                             exits [INCOMPLETE]. This is the one that
      #                             actually saves the work.
      #   timeout-minutes      330  kills a generator that hangs before its
      #                             own budget fires (a wedged socket, say),
      #                             leaving the publish step to still run.
      #   job timeout-minutes  350  last resort, 10 minutes under the
      #                             runner's own 360.
      #
      # The 10-minute gaps are the point: each layer needs time to hand over
      # to the next. Shorter rounds are fine as long as the spacing holds,
      # e.g. 100 / 110 / 120 for a two-hour cycle.
      - name: Build pronunciation pack
        timeout-minutes: 330
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PACK_RELEASE_TAG: audio-pack
          # Empty on a push event; set only for a manual test run.
          PACK_LIMIT: ${{ inputs.limit }}
          # A push event sends no inputs, so the budget falls back to 320.
          TIME_BUDGET_MINUTES: ${{ inputs.budget || '320' }}
          PRUNE_VOICES: ${{ inputs.prune_voices }}
        run: |
          ARGS=""
          if [ -n "$PACK_LIMIT" ]; then
            echo "Test run: limiting to $PACK_LIMIT word(s)."
            ARGS="$ARGS --limit $PACK_LIMIT"
          fi
          if [ "$PRUNE_VOICES" = "true" ]; then
            echo "Also pruning clips for voices that are no longer used."
            ARGS="$ARGS --prune-voices"
          fi
          echo "Time budget: $TIME_BUDGET_MINUTES minute(s)."
          python tools/generate_audio_pack.py $ARGS

      - name: Publish pack to the audio-pack release
        # always() is what makes a stopped run a checkpoint rather than a
        # loss: whether the build finished, spent its time budget, hit the
        # OpenAI usage limit, or was cut off by the step timeout, whatever
        # was written to dist/ gets published. The next run downloads it and
        # continues, so no clip is ever paid for twice.
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: audio-pack
          name: EMPro audio pack
          # A no-op run produces no delta file; skip it instead of failing.
          fail_on_unmatched_files: false
          body: >
            Pre-generated pronunciation audio for EMPro. This release is
            updated in place by the Build audio pack workflow. The download
            URLs are stable, so the app can always fetch the latest pack
            from the same address.
          # Only the parts this run rebuilt are in dist/, so only they are
          # uploaded. Unchanged parts are already on the release and are left
          # exactly as they are - that is the whole point of the split.
          files: |
            tools/dist/*.empack
            tools/dist/empro-audio-pack.manifest.json

      # The publish step adds and replaces assets but never removes any, so
      # parts for deleted words, and the pre-split pack itself, would sit on
      # the release forever. The generator writes keep-assets.txt naming
      # exactly what should exist; everything else matching the pack pattern
      # goes. Skipped when the build produced no manifest, so a failed run
      # can never delete a working pack.
      - name: Remove stale pack assets
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          KEEP=tools/dist/keep-assets.txt
          if [ ! -f "$KEEP" ]; then
            echo "No keep-assets.txt (the build did not get that far); keeping every asset."
            exit 0
          fi
          echo "Assets that should exist:"; cat "$KEEP"
          gh api "repos/$REPO/releases/tags/audio-pack" \
            --jq '.assets[] | "\(.id) \(.name)"' > /tmp/assets.txt || exit 0
          awk '{print $2}' /tmp/assets.txt > /tmp/names.txt

          # Refuse to delete anything until every asset that SHOULD exist is
          # actually on the release. Without this check, a publish that only
          # got half its parts up would still prune, and the thing it pruned
          # would be the previous pack - the only copy of audio that cost real
          # money. The next build would then find nothing and synthesise all
          # of it again. Leaving a stale asset behind for one cycle is the
          # cheap mistake; deleting a good pack is the expensive one.
          MISSING=0
          while read -r want; do
            [ -z "$want" ] && continue
            if ! grep -Fxq "$want" /tmp/names.txt; then
              echo "  not on the release yet: $want"
              MISSING=$((MISSING + 1))
            fi
          done < "$KEEP"
          if [ "$MISSING" -gt 0 ]; then
            echo "$MISSING expected asset(s) missing - deleting nothing."
            echo "Re-run the workflow; the next successful publish will prune."
            exit 0
          fi

          while read -r id name; do
            case "$name" in
              empro-audio-pack*) ;;
              *) continue ;;
            esac
            if ! grep -Fxq "$name" "$KEEP"; then
              echo "Deleting stale asset: $name"
              gh api -X DELETE "repos/$REPO/releases/assets/$id" || true
            fi
          done < /tmp/assets.txt
