name: Build audio pack

# Builds the EMPro pronunciation pack and publishes it as a Release asset.
#
# Runs when:
#   - tools/wordlist.txt changes on the main branch (the EMPro app commits
#     that file itself, so a build starts without anyone touching git), or
#   - it is started by hand from the Actions tab (Run workflow).
#
# A run is bounded so that a timeout can never lose synthesised audio; see
# the three nested limits on the build step below.
#
# Setup needed once:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     name : OPENAI_API_KEY
#     value: your OpenAI API key (sk-...)
#   The key stays encrypted in the secret and never reaches the app.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max words to synthesise this run (blank = all). Use a small number for a test run."
        required: false
        default: ""
      budget:
        description: "Minutes this run may spend synthesising before it stops and publishes what it has."
        required: false
        default: "320"
      prune_voices:
        description: "Also delete clips whose voice is no longer used, reclaiming pack space. Re-selecting that voice means paying again."
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - tools/wordlist.txt

# The job updates a Release, so it needs write access to repository contents.
permissions:
  contents: write

# One build at a time; a newer run waits rather than racing the release.
concurrency:
  group: audio-pack
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Outermost of three nested limits. A hosted runner is killed at 360
    # minutes, so 350 keeps 10 minutes in hand for the publish step to run
    # after a hung build is cut off. See the build step for the other two.
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Three nested limits, innermost first:
      #
      #   TIME_BUDGET_MINUTES  320  the generator's own budget. It stops
      #                             itself, writes the partial pack, and
      #                             exits [INCOMPLETE]. This is the one that
      #                             actually saves the work.
      #   timeout-minutes      330  kills a generator that hangs before its
      #                             own budget fires (a wedged socket, say),
      #                             leaving the publish step to still run.
      #   job timeout-minutes  350  last resort, 10 minutes under the
      #                             runner's own 360.
      #
      # The 10-minute gaps are the point: each layer needs time to hand over
      # to the next. Shorter rounds are fine as long as the spacing holds,
      # e.g. 100 / 110 / 120 for a two-hour cycle.
      - name: Build pronunciation pack
        timeout-minutes: 330
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PACK_RELEASE_TAG: audio-pack
          # Empty on a push event; set only for a manual test run.
          PACK_LIMIT: ${{ inputs.limit }}
          # A push event sends no inputs, so the budget falls back to 320.
          TIME_BUDGET_MINUTES: ${{ inputs.budget || '320' }}
          PRUNE_VOICES: ${{ inputs.prune_voices }}
        run: |
          ARGS=""
          if [ -n "$PACK_LIMIT" ]; then
            echo "Test run: limiting to $PACK_LIMIT word(s)."
            ARGS="$ARGS --limit $PACK_LIMIT"
          fi
          if [ "$PRUNE_VOICES" = "true" ]; then
            echo "Also pruning clips for voices that are no longer used."
            ARGS="$ARGS --prune-voices"
          fi
          echo "Time budget: $TIME_BUDGET_MINUTES minute(s)."
          python tools/generate_audio_pack.py $ARGS

      - name: Publish pack to the audio-pack release
        # always() is what makes a stopped run a checkpoint rather than a
        # loss: whether the build finished, spent its time budget, hit the
        # OpenAI usage limit, or was cut off by the step timeout, whatever
        # was written to dist/ gets published. The next run downloads it and
        # continues, so no clip is ever paid for twice.
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: audio-pack
          name: EMPro audio pack
          # A no-op run produces no delta file; skip it instead of failing.
          fail_on_unmatched_files: false
          body: >
            Pre-generated pronunciation audio for EMPro. This release is
            updated in place by the Build audio pack workflow. The download
            URLs are stable, so the app can always fetch the latest pack
            from the same address.
          files: |
            tools/dist/empro-audio-pack.empack
            tools/dist/empro-audio-pack.delta.empack
            tools/dist/empro-audio-pack.manifest.json
